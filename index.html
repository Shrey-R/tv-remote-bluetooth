<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e13">
<title>TV Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<!--
  The remote's front door, on GitHub Pages so it opens over any internet connection. It checks whether the TV answers
  over Wi-Fi: if so it opens the full remote on the TV; if not it helps get the TV back on Wi-Fi over Bluetooth (connect,
  then turn its Wi-Fi on, waking the screen first if it's in standby), and opens the full remote once the TV is back.
  Bluetooth needs a Web Bluetooth browser (Bluefy on iPhone, Chrome on Android). Talks to Night Watch's BleRemote service
  (tv-launcher/.../BleRemote.java). Self-contained; ?stay=1 skips the redirect.
-->
<style>
  :root {
    --amber: #e0b552; --amber-lt: #f0c96a; --a: 224, 181, 82;
    --bg-top: #121319; --bg-bottom: #0d0e13; --btn: #181a22; --edge: #262832; --raised: #1c1e27;
    --text: #e9e9ed; --text-2: #b2b6ca; --muted: #9397ab; --dim: #75798c; --green: #66cc8c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg-bottom); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); display: flex;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    font: 400 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 420px; margin: auto; display: flex; flex-direction: column; gap: 22px;
    padding: max(40px, calc(env(safe-area-inset-top) + 24px)) 24px calc(env(safe-area-inset-bottom) + 32px);
  }
  .brand { font-size: 11px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); text-align: center; }
  h1 { margin: 6px 0 0; font-size: 24px; font-weight: 500; text-align: center; }
  .sub { margin: 6px 0 0; color: var(--text-2); text-align: center; }

  .status { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 26px 18px; border-radius: 24px;
    background: var(--raised); box-shadow: 0 0 0 1px rgba(var(--a), .45), 0 0 28px rgba(var(--a), .12); text-align: center; }
  .orb { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--btn);
    box-shadow: 0 0 0 1px rgba(var(--a), .5); }
  .orb svg { width: 28px; height: 28px; fill: none; stroke: var(--amber-lt); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .orb.busy { animation: pulse 1.4s ease-in-out infinite; }
  .orb.ok { box-shadow: 0 0 0 2px var(--green), 0 0 22px rgba(102, 204, 140, .35); }
  .orb.ok svg { stroke: var(--green); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--amber), 0 0 26px rgba(var(--a), .4); } }
  @media (prefers-reduced-motion: reduce) { .orb.busy { animation: none; } }
  .status h2 { margin: 0; font-size: 18px; font-weight: 500; }
  .status p { margin: 0; color: var(--text-2); font-size: 14px; }

  .steps { display: flex; flex-direction: column; gap: 12px; }
  .steps[hidden] { display: none; }
  .step { display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 16px; border-radius: 18px;
    background: var(--btn); border: 1px solid var(--edge); }
  .num { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
    color: var(--amber-lt); box-shadow: 0 0 0 1px rgba(var(--a), .6); }
  .step.done .num { color: var(--bg-bottom); background: var(--green); box-shadow: none; }
  .step div { flex: 1; min-width: 0; }
  .step b { display: block; font-weight: 500; }
  .step span { color: var(--muted); font-size: 13px; }
  .step button {
    flex: none; height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 500;
    color: var(--amber-lt); background: rgba(var(--a), .06); border: 1px solid var(--amber); cursor: pointer;
  }
  .step button:disabled { opacity: .35; }
  .step button:active { transform: scale(.96); }

  .foot { font-size: 12px; color: var(--dim); text-align: center; line-height: 1.7; }
  .foot a { color: var(--text-2); }
</style>
</head>
<body>
<main>
  <div>
    <div class="brand">Lawrasur</div>
    <h1>TV Remote</h1>
  </div>

  <div class="status">
    <div class="orb busy" id="orb">
      <svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg>
    </div>
    <h2 id="head">Checking the TV…</h2>
    <p id="text">Looking for it on your Wi-Fi.</p>
  </div>

  <div class="steps" id="steps" hidden>
    <div class="step" id="step1">
      <span class="num">1</span>
      <div><b>Connect to the TV</b><span id="s1">Over Bluetooth, from near the TV</span></div>
      <button id="connect" type="button">Connect</button>
    </div>
    <div class="step" id="step2">
      <span class="num">2</span>
      <div><b>Turn on the TV's Wi-Fi</b><span id="s2">Wakes the TV if it's in standby</span></div>
      <button id="wifi" type="button" disabled>Turn on</button>
    </div>
  </div>

  <p class="foot">
    <a href="#" id="open">Open the remote</a> · TV address <a href="#" id="addr"></a><br>
    <span id="note"></span>
  </p>
</main>

<script>
  // Must match BleRemote.java on the TV.
  const SERVICE = 'f2f50001-1c0e-4349-9c37-2281906ff403';
  const COMMAND = 'f2f50002-1c0e-4349-9c37-2281906ff403';
  const RESULT = 'f2f50003-1c0e-4349-9c37-2281906ff403';
  const $ = id => document.getElementById(id);
  const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
                  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
  const stay = new URLSearchParams(location.search).has('stay');
  let command = null, nextId = 1, busy = Promise.resolve();   // Bluetooth link, set once connected
  const waiting = new Map();   // Bluetooth requests waiting for the TV: id -> {resolve, pieces}

  let tvHost = store.get('tvHost') || '192.168.68.104';
  // https only when this phone trusts the TV's certificate; otherwise http, and the TV's own page moves trusted phones
  // to https by itself.
  const remoteUrl = (secure = false) => `${secure ? 'https' : 'http'}://${tvHost}:8765/`;
  function setHost(ip) {
    if (!ip || ip === tvHost) return;
    tvHost = ip;
    store.set('tvHost', ip);
    $('addr').textContent = ip;
  }
  $('addr').textContent = tvHost;
  $('addr').addEventListener('click', e => {
    e.preventDefault();
    const v = prompt('TV address on your Wi-Fi (IP or name)', tvHost);
    if (v && v.trim()) { tvHost = v.trim(); store.set('tvHost', tvHost); $('addr').textContent = tvHost; look(); }
  });
  $('open').addEventListener('click', e => { e.preventDefault(); location.href = remoteUrl(); });

  function show(head, text, orb) {
    $('head').textContent = head;
    $('text').textContent = text;
    $('orb').className = 'orb ' + (orb || '');
  }

  // ---------- Is the TV on Wi-Fi? ----------
  // First over Wi-Fi: an opaque no-cors https request resolves if the TV's server answers at the saved address (and
  // this phone trusts its certificate), with no special headers needed on the TV. If that fails and Bluetooth is
  // connected, ask the TV itself: Night Watch says whether it's on Wi-Fi and at which (possibly new) address.
  async function reachable() {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 2500);
    try {
      await fetch(`${remoteUrl(true)}status?probe=${Date.now()}`, { mode: 'no-cors', cache: 'no-store', signal: c.signal });
      return 'https';
    } catch {} finally { clearTimeout(t); }
    if (command) {
      const r = await ask({ g: '/net' });
      if (r.body && r.body.wifi && r.body.ip) { setHost(r.body.ip); return 'http'; }
    }
    return null;
  }

  let looking = false, gone = false, wifiSent = false;
  async function look() {
    if (looking || gone) return;
    looking = true;
    const ok = await reachable();
    looking = false;
    if (ok) {
      show('Your remote is ready', stay ? `The TV is on Wi-Fi at ${tvHost}. Tap “Open the remote” below.`
        : `The TV is on Wi-Fi at ${tvHost}. Opening it now…`, 'ok');
      $('steps').hidden = true;
      if (!stay) { gone = true; setTimeout(() => location.replace(remoteUrl(ok === 'https')), 600); }
      return;
    }
    $('steps').hidden = false;
    if (wifiSent) show('Waiting for the TV…', 'Its Wi-Fi is on. Your remote opens by itself once the TV rejoins.', 'busy');
    else show('The TV isn’t on Wi-Fi', 'Get it back in two steps, then your remote opens by itself.', '');
  }
  look();
  setInterval(() => { if (!document.hidden) look(); }, 3000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) look(); });

  // ---------- Bluetooth ----------

  if (!navigator.bluetooth) {
    $('connect').disabled = true;
    $('s1').textContent = 'This browser has no Bluetooth: open this page in Bluefy (iPhone) or Chrome (Android)';
  }

  function onResult(e) {
    let r;
    try { r = JSON.parse(new TextDecoder().decode(e.target.value)); } catch { return; }
    const w = waiting.get(r.i);
    if (!w) return;
    if (r.d === undefined) { waiting.delete(r.i); w.resolve(r); return; }   // a short result: {"c":200,"m":"ok"}
    w.pieces[r.k] = r.d;                                                      // a read: base64 in pieces
    if (Object.keys(w.pieces).length === r.n) {
      waiting.delete(r.i);
      try {
        const bytes = Uint8Array.from(atob(Array.from({ length: r.n }, (_, k) => w.pieces[k]).join('')), ch => ch.charCodeAt(0));
        w.resolve({ c: r.c, body: JSON.parse(new TextDecoder().decode(bytes)) });
      } catch { w.resolve({ c: 0 }); }
    }
  }

  // One command (or read) over Bluetooth; resolves with the TV's answer, or {c: 0} after 10 s.
  function ask(msg) {
    const i = nextId++;
    return new Promise(resolve => {
      waiting.set(i, { resolve, pieces: {} });
      setTimeout(() => { if (waiting.delete(i)) resolve({ c: 0 }); }, 10000);
      const data = new TextEncoder().encode(JSON.stringify(Object.assign({ i }, msg)));
      busy = busy.then(() => command.writeValueWithResponse(data)).catch(() => { waiting.delete(i); resolve({ c: 0 }); });
    });
  }

  async function attach(device) {
    device.addEventListener('gattserverdisconnected', () => {
      command = null;
      $('wifi').disabled = true;
      $('step1').classList.remove('done');
      $('s1').textContent = 'Disconnected: tap Connect again';
    });
    $('s1').textContent = 'Connecting…';
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    command = await service.getCharacteristic(COMMAND);
    const result = await service.getCharacteristic(RESULT);
    result.addEventListener('characteristicvaluechanged', onResult);
    $('s1').textContent = 'Pairing… if a code appears, confirm it on the TV too';
    await result.startNotifications();   // needs an encrypted link: the first time, phone and TV show a code
    $('step1').classList.add('done');
    $('s1').textContent = 'Connected over Bluetooth';
    $('wifi').disabled = false;
    look();   // ask the TV right away: it may already be on Wi-Fi, just at a new address
  }

  $('connect').addEventListener('click', async () => {
    try {
      const d = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
      await attach(d);
    } catch (err) {
      $('s1').textContent = err && err.name === 'NotFoundError' ? 'No TV chosen: tap Connect and pick the TV'
        : 'Couldn’t connect: ' + (err && err.message || err);
    }
  });

  // In standby the TV can't look for Wi-Fi with the screen off, so wake it first (Power only if it's asleep:
  // on an awake TV, Power would switch it off), then turn its Wi-Fi on.
  $('wifi').addEventListener('click', async () => {
    if (!command) return;
    $('wifi').disabled = true;
    $('s2').textContent = 'Checking the TV…';
    const now = await ask({ g: '/nowplaying' });
    if (now.body && now.body.screen && now.body.screen.state === 'asleep') {
      $('s2').textContent = 'Waking the TV…';
      await ask({ p: 'key', b: { key: 'power' } });
      await new Promise(r => setTimeout(r, 1500));
    }
    $('s2').textContent = 'Turning Wi-Fi on…';
    const r = await ask({ p: 'wifi/on', b: {} });
    if (r.c === 200) {
      wifiSent = true;
      $('step2').classList.add('done');
      $('s2').textContent = r.m === 'wifi already on' ? 'Wi-Fi was already on: waiting for it to rejoin' : 'Wi-Fi is on: rejoining…';
      look();
    } else {
      $('s2').textContent = r.c === 0 ? 'No answer from the TV: try again' : 'The TV said: ' + (r.m || r.c);
      $('wifi').disabled = false;
    }
  });

  // A copy on the phone where the browser supports it (Chrome on Android; not Bluefy).
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  $('note').textContent = 'Opens over any internet connection, even when the TV is off Wi-Fi.';
</script>
</body>
</html>
